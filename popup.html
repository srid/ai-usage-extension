<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Usage</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        width: 320px;
        background: Canvas;
        color: CanvasText;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      header {
        align-items: center;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        font-size: 16px;
        font-weight: 650;
        line-height: 1.2;
        margin: 0;
      }

      button {
        border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-radius: 6px;
        background: ButtonFace;
        color: ButtonText;
        cursor: pointer;
        font: inherit;
        padding: 6px 9px;
      }

      button:disabled {
        cursor: default;
        opacity: 0.6;
      }

      .summary {
        border: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
        border-radius: 8px;
        padding: 12px;
      }

      .meter {
        display: grid;
        gap: 6px;
        margin-block-start: 10px;
      }

      .meter-row {
        align-items: center;
        display: flex;
        gap: 8px;
        justify-content: space-between;
      }

      .label {
        font-size: 12px;
        line-height: 1.25;
      }

      .value {
        font-variant-numeric: tabular-nums;
        font-weight: 650;
      }

      progress {
        accent-color: #2f7dd3;
        height: 10px;
        width: 100%;
      }

      .muted {
        color: color-mix(in srgb, CanvasText 62%, transparent);
        font-size: 12px;
        line-height: 1.35;
      }

      .error {
        color: #b42318;
      }

      ul {
        display: grid;
        gap: 8px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>AI Usage</h1>
        <button id="refresh" type="button">Refresh</button>
      </header>
      <section id="content" class="summary" aria-live="polite"></section>
    </main>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
